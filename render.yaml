# Render blueprint for the Recouper operator dashboard.
#
# Render rather than a serverless host, on purpose. The dashboard keeps live
# runs in memory and writes snapshots plus a hash-chained audit ledger to
# runs/ on disk. A serverless function is stateless between invocations and
# has no writable persistent filesystem, so create-a-run/approve-it/resume-it
# -- the actual product lifecycle -- cannot work there.
services:
  - type: web
    name: recouper
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # $PORT is assigned by Render; binding 0.0.0.0 is required to accept
    # traffic from outside the container.
    startCommand: uvicorn recouper.webapp:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # No PYTHON_VERSION pin: the code needs 3.10+ only (it uses
      # `from __future__ import annotations` throughout), and pinning an exact
      # patch release that Render has not built is a needless way to fail a
      # deploy. Render's default is well past 3.10.
      - key: PYTHONUNBUFFERED
        value: "1"
      # Declared so a blueprint sync does not drop it, but deliberately not
      # given a value here: sync:false means "this variable exists, its value
      # is set in the dashboard, leave it alone". A key committed to the repo
      # would be a key published to GitHub.
      #
      # Absent, the console simply has no live planner: /api/meta reports
      # live_planner:null, the re-plan button is hidden, and every plan comes
      # from the deterministic table. A component that touches money has to
      # work when the model is unavailable.
      - key: GEMINI_API_KEY
        sync: false
